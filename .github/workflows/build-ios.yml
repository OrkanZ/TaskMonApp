name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.1

      - name: Build IPA
        run: |
          flet build ipa --exclude venv --android-extract-packages certifi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMonApp-iOS
          path: build/ipa/*.ipa
